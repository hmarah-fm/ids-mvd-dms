version: '3.9'

services:
  consumer-identity-hub:
    image: identity-hub
    hostname: consumer-identity-hub
    container_name: consumer-identity-hub
    volumes:
      - ./deployment/assets/env/consumer_identityhub.env:/etc/app/env-file:ro
    ports:
      - "7080:7080"
    networks:
      - ids-mvd-dms

networks:
  ids-mvd-dms:
    driver: bridge

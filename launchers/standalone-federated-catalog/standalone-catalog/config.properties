###############################################
#  DSP‑2025 API
###############################################
web.http.dsp.port=8282
web.http.dsp.path=/dsp
edc.dsp.callback.address=http://localhost:8282/dsp

###############################################
#  Federated Catalog Core
###############################################
edc.catalog.cache.enabled=true
edc.catalog.cache.ttl=300
edc.catalog.cache.size=10000

###############################################
#  Federated Catalog Crawler
###############################################
edc.fc.crawler.enabled=true
edc.fc.crawler.interval=60
edc.fc.crawler.batch.size=20

###############################################
#  Federated Catalog Storage
###############################################
#edc.fc.store.type=sql
#edc.fc.store.datasource=default

###############################################
#  Dataset → Participant Resolution
###############################################
edc.fc.enrichment.owner.enabled=true

version: "3.8"

services:
  graphdb_centralKG:
    image: ontotext/graphdb:10.3.3
    container_name: graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      GDB_HEAP_SIZE: 4g
      GDB_MIN_MEM: 1g
      GDB_MAX_MEM: 4g
      GRAPHDB_SECURITY: "true"
      GRAPHDB_ADMIN_PASSWORD: "mypassword"   # change this!
    volumes:
      - ./graphdb-data:/opt/graphdb/home
      - ./config:/config
